<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>M4B Web Player</title>
  <script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js"></script>
  <style>
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --accent: #0a84ff;
      --text: #f5f5f7;
      --text-muted: #86868b;
      --border: #2c2c2e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .player-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .file-picker-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 12px 20px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .cover-art {
      width: 250px;
      height: 250px;
      border-radius: 16px;
      background: #151516;
      border: 1px solid var(--border);
      box-shadow: 0 16px 32px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .cover-art svg { width: 70px; height: 70px; fill: #3a3a3c; }
    .track-info {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }
    .track-title {
      font-size: 1.15rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chapter-select {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.85rem;
      padding: 8px 12px;
      border-radius: 10px;
      width: 100%;
      outline: none;
    }
    .progress-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }
    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: Menlo, monospace;
    }
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 6px;
    }
    .ctrl-btn {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ctrl-btn svg { width: 28px; height: 28px; fill: var(--text); }
    .play-btn {
      width: 64px;
      height: 64px;
      background: var(--accent);
      border-radius: 50%;
    }
    .play-btn svg { width: 32px; height: 32px; fill: white; }
    .footer-controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .sub-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="player-container">
    <button class="file-picker-btn" onclick="document.getElementById('m4bFile').click()">
      Scegli Audiolibro M4B
    </button>
    <input type="file" id="m4bFile" accept=".m4b,.m4a,.mp3" style="display:none;">

    <div class="cover-art" id="coverBox">
      <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
    </div>

    <div class="track-info">
      <div class="track-title" id="bookTitle">Nessun file aperto</div>
      <select class="chapter-select" id="chapterSelect" disabled>
        <option>Nessun capitolo rilevato</option>
      </select>
    </div>

    <div class="progress-section">
      <input type="range" id="seekSlider" min="0" max="100" value="0" step="0.1">
      <div class="time-labels">
        <span id="currTime">00:00:00</span>
        <span id="durTime">00:00:00</span>
      </div>
    </div>

    <div class="controls">
      <!-- Capitolo Precedente -->
      <button class="ctrl-btn" id="prevChapBtn" title="Capitolo precedente">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>

      <!-- Salto -15s -->
      <button class="ctrl-btn" id="rwBtn" title="-15s">
        <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.2 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
      </button>

      <!-- Play / Pausa -->
      <button class="ctrl-btn play-btn" id="playBtn">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <!-- Salto +30s -->
      <button class="ctrl-btn" id="ffBtn" title="+30s">
        <svg viewBox="0 0 24 24"><path d="M11.5 8c2.65 0 5.05.99 6.9 2.6L22 7v9h-9l3.62-3.62c-1.39-1.2-3.16-1.88-5.12-1.88-3.54 0-6.55 2.31-7.6 5.5l-2.37-.78C2.92 11.03 6.85 8 11.5 8z"/></svg>
      </button>

      <!-- Capitolo Successivo -->
      <button class="ctrl-btn" id="nextChapBtn" title="Capitolo successivo">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>

    <div class="footer-controls">
      <button class="sub-btn" id="speedBtn">1.0x</button>
    </div>

    <audio id="audioElement" preload="metadata"></audio>
  </div>

  <script>
    const audio = document.getElementById('audioElement');
    const m4bFile = document.getElementById('m4bFile');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const seekSlider = document.getElementById('seekSlider');
    const currTime = document.getElementById('currTime');
    const durTime = document.getElementById('durTime');
    const bookTitle = document.getElementById('bookTitle');
    const chapterSelect = document.getElementById('chapterSelect');
    const prevChapBtn = document.getElementById('prevChapBtn');
    const nextChapBtn = document.getElementById('nextChapBtn');
    const rwBtn = document.getElementById('rwBtn');
    const ffBtn = document.getElementById('ffBtn');
    const speedBtn = document.getElementById('speedBtn');

    let chapters = [];
    let speeds = [1.0, 1.15, 1.25, 1.5];
    let speedIdx = 0;
    let currentKey = "";

    function formatTime(sec) {
      if (isNaN(sec)) return "00:00:00";
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = Math.floor(sec % 60);
      return [h, m, s].map(v => v.toString().padStart(2, '0')).join(':');
    }

    m4bFile.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;

      currentKey = "pos_" + file.name + "_" + file.size;
      bookTitle.textContent = file.name.replace(/\.[^/.]+$/, "");
      audio.src = URL.createObjectURL(file);

      // Reset capitoli
      chapters = [];
      chapterSelect.innerHTML = '<option>Lettura capitoli in corso...</option>';
      chapterSelect.disabled = true;

      // Parsing capitoli MP4 client-side
      const mp4boxfile = MP4Box.createFile();
      mp4boxfile.onReady = (info) => {
        if (info.chapters && info.chapters.length > 0) {
          chapters = info.chapters.map((c, i) => ({
            title: c.title || `Capitolo ${i + 1}`,
            start: c.start_time / info.timescale
          }));
          populateChapters();
        } else {
          chapterSelect.innerHTML = '<option>Nessun capitolo incorporato</option>';
        }
      };

      const reader = new FileReader();
      reader.onload = (ev) => {
        const buffer = ev.target.result;
        buffer.fileStart = 0;
        mp4boxfile.appendBuffer(buffer);
        mp4boxfile.flush();
      };
      // Legge i primi 3MB dove risiede l'atom moov con i capitoli
      reader.readAsArrayBuffer(file.slice(0, 3 * 1024 * 1024));

      // Ripristina salvataggio precedente
      const saved = localStorage.getItem(currentKey);
      if (saved) {
        audio.currentTime = parseFloat(saved);
      }
      audio.play();
    };

    function populateChapters() {
      chapterSelect.innerHTML = '';
      chapters.forEach((c, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${c.title} (${formatTime(c.start)})`;
        chapterSelect.appendChild(opt);
      });
      chapterSelect.disabled = false;
    }

    function getCurrentChapterIndex() {
      if (!chapters.length) return -1;
      const t = audio.currentTime;
      for (let i = chapters.length - 1; i >= 0; i--) {
        if (t >= chapters[i].start) return i;
      }
      return 0;
    }

    chapterSelect.onchange = () => {
      const idx = parseInt(chapterSelect.value);
      if (chapters[idx]) {
        audio.currentTime = chapters[idx].start;
      }
    };

    prevChapBtn.onclick = () => {
      if (!chapters.length) return;
      const idx = getCurrentChapterIndex();
      // Se siamo più avanti di 3 secondi dall'inizio del capitolo, torna a inizio capitolo corrente
      if (audio.currentTime - chapters[idx].start > 3 || idx === 0) {
        audio.currentTime = chapters[idx].start;
      } else {
        audio.currentTime = chapters[idx - 1].start;
      }
    };

    nextChapBtn.onclick = () => {
      if (!chapters.length) return;
      const idx = getCurrentChapterIndex();
      if (idx < chapters.length - 1) {
        audio.currentTime = chapters[idx + 1].start;
      }
    };

    playBtn.onclick = () => {
      if (!audio.src) return;
      audio.paused ? audio.play() : audio.pause();
    };

    audio.onplay = () => {
      playIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
    };

    audio.onpause = () => {
      playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    };

    audio.ontimeupdate = () => {
      currTime.textContent = formatTime(audio.currentTime);
      if (audio.duration) {
        seekSlider.value = (audio.currentTime / audio.duration) * 100;
        if (currentKey) {
          localStorage.setItem(currentKey, audio.currentTime);
        }
      }
      if (chapters.length) {
        const idx = getCurrentChapterIndex();
        if (chapterSelect.value != idx) {
          chapterSelect.value = idx;
        }
      }
    };

    audio.onloadedmetadata = () => {
      durTime.textContent = formatTime(audio.duration);
    };

    seekSlider.oninput = () => {
      if (audio.duration) {
        audio.currentTime = (seekSlider.value / 100) * audio.duration;
      }
    };

    rwBtn.onclick = () => audio.currentTime = Math.max(0, audio.currentTime - 15);
    ffBtn.onclick = () => audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 30);

    speedBtn.onclick = () => {
      speedIdx = (speedIdx + 1) % speeds.length;
      audio.playbackRate = speeds[speedIdx];
      speedBtn.textContent = `${speeds[speedIdx]}x`;
    };
  </script>
</body>
</html>
